name: Release Linux packages

on:
  push:
    branches: [main]
    paths: ['.github/release-version']
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-linux-packages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2

jobs:
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify release version
        id: version
        run: |
          python3 - <<'PY'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version']
          tag = f'v{version}'
          assert pathlib.Path('.github/release-version').read_text().strip() == tag
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == tag
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\n')
          changelog = pathlib.Path('CHANGELOG.md').read_text()
          section = changelog.split(f'## {tag} ', 1)[1].split('\n## ', 1)[0]
          pathlib.Path('release-notes.md').write_text(f'# MyGdrive Rust {tag}\n\n' + section.split('\n', 1)[1])
          PY
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config libgtk-4-dev dpkg-dev flatpak python3
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Check formatting and lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-features --all-targets -- -D warnings
      - name: Run tests
        run: |
          cargo test --locked --all-features --all-targets
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Build Debian package
        run: scripts/build-deb.sh
      - name: Install Flatpak runtime
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y flathub org.gnome.Platform//50
      - name: Build Flatpak bundle
        run: scripts/build-flatpak.sh --skip-build
      - name: Inspect packages and create checksums
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
          cd dist
          sha256sum mygdrive-rust_*.deb mygdrive-rust_*.flatpak > SHA256SUMS
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [[ $(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft) != true ]]; then
              echo 'Version already published; existing release is unchanged.'
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft \
              --title "MyGdrive Rust $RELEASE_TAG" --notes-file release-notes.md
          fi
          for asset in dist/mygdrive-rust_*.deb dist/mygdrive-rust_*.flatpak dist/SHA256SUMS; do
            name=$(basename "$asset")
            if ! gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
              gh release upload "$RELEASE_TAG" "$asset"
            fi
          done
          gh release edit "$RELEASE_TAG" --draft=false --latest
