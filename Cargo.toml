[package]
name = "mygdrive-sync"
version = "1.0.4"
edition = "2021"
description = "Offline-first, preserve-both Google Drive sync engine"
license = "MIT"

[features]
default = []
desktop-ui = ["dep:gtk", "dep:ksni"]
virtual-drive = ["dep:fuser", "dep:gio"]

[[bin]]
name = "mygdrive-mount"
path = "src/bin/mount.rs"
required-features = ["virtual-drive"]

[[bin]]
name = "mygdrive-desktop"
path = "src/bin/desktop.rs"
required-features = ["desktop-ui"]

[dependencies]
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
fs2 = "0.4"
fuser = { version = "0.16", default-features = false, features = ["abi-7-31"], optional = true }
futures-util = "0.3"
gio = { version = "0.22", optional = true }
gtk = { package = "gtk4", version = "0.11", optional = true }
ksni = { version = "0.3", optional = true }
libc = "0.2"
md-5 = "0.10"
notify = "8.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "derive"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[profile.release]
lto = "thin"
strip = true
